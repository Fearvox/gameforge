name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint + Build + SVG Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: SVG XML validation
        run: |
          echo "Checking SVG well-formedness (catches unescaped &, invalid XML)..."
          find . -name "*.svg" -not -path "./node_modules/*" -print0 | while IFS= read -r -d '' f; do
            echo "  Check: $f"
            xmllint --noout "$f" 2>&1 || { echo "FAIL: $f — run xmllint --noout $f locally"; exit 1; }
          done

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" font-family="'Geist', system-ui, sans-serif">
  <defs>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1200" fill="#0a0b0f"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="1200" fill="#0d0e14"/>
  <rect x="240" y="0" width="1" height="1200" fill="rgba(255,255,255,0.06)"/>
  <text x="28" y="42" fill="url(#accent-grad)" font-size="18" font-weight="700">🎮 GameForge</text>
  <text x="28" y="60" fill="rgba(255,255,255,0.3)" font-size="10">UP 主工作台</text>

  <!-- Nav -->
  <g fill="rgba(255,255,255,0.5)" font-size="13" font-weight="500">
    <rect x="12" y="88" width="216" height="40" rx="10" fill="transparent"/>
    <text x="48" y="113">📊 项目主页</text>
    <rect x="12" y="136" width="216" height="40" rx="10" fill="transparent"/>
    <text x="48" y="161">📁 素材库</text>
    <rect x="12" y="184" width="216" height="40" rx="10" fill="transparent"/>
    <text x="48" y="209">✂️ 智能剪辑</text>
    <rect x="12" y="232" width="216" height="40" rx="10" fill="transparent"/>
    <text x="48" y="257">🎨 封面工坊</text>
    <!-- Active: 发布中心 -->
    <rect x="12" y="280" width="216" height="40" rx="10" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
    <text x="48" y="305" fill="#a855f7" font-weight="600">🚀 发布中心</text>
  </g>

  <!-- Main Content -->
  <!-- Top Bar -->
  <rect x="240" y="0" width="1200" height="64" fill="rgba(13,14,20,0.85)"/>
  <text x="272" y="40" fill="rgba(255,255,255,0.9)" font-size="18" font-weight="600">发布中心</text>

  <!-- Tab Bar -->
  <g transform="translate(272, 76)">
    <rect x="0" y="0" width="120" height="36" rx="18" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
    <text x="60" y="23" fill="#a855f7" font-size="12" font-weight="600" text-anchor="middle">发布队列</text>

    <rect x="132" y="0" width="120" height="36" rx="18" fill="transparent"/>
    <text x="192" y="23" fill="rgba(255,255,255,0.5)" font-size="12" font-weight="500" text-anchor="middle">排程日历</text>

    <rect x="264" y="0" width="120" height="36" rx="18" fill="transparent"/>
    <text x="324" y="23" fill="rgba(255,255,255,0.5)" font-size="12" font-weight="500" text-anchor="middle">平台绑定</text>
  </g>

  <!-- ═══════════ SECTION 1: PLATFORM STATUS BAR ═══════════ -->
  <g transform="translate(272, 132)">
    <rect x="0" y="0" width="1120" height="72" rx="14" fill="url(#glass)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="20" fill="rgba(255,255,255,0.55)" font-size="11" font-weight="500">平台状态</text>

    <!-- Platform: B站 -->
    <g transform="translate(20, 30)">
      <circle cx="12" cy="12" r="12" fill="rgba(168,85,247,0.2)"/>
      <text x="12" y="16" fill="#a855f7" font-size="10" font-weight="600" text-anchor="middle">B</text>
      <text x="32" y="16" fill="rgba(255,255,255,0.8)" font-size="12" font-weight="500">B站</text>
      <circle cx="80" cy="12" r="4" fill="#22c55e"/>
      <text x="92" y="16" fill="rgba(255,255,255,0.55)" font-size="10">已连接</text>
    </g>

    <!-- Platform: YouTube -->
    <g transform="translate(200, 30)">
      <circle cx="12" cy="12" r="12" fill="rgba(255,0,0,0.15)"/>
      <text x="12" y="16" fill="#ff4444" font-size="10" font-weight="600" text-anchor="middle">Y</text>
      <text x="32" y="16" fill="rgba(255,255,255,0.8)" font-size="12" font-weight="500">YouTube</text>
      <circle cx="110" cy="12" r="4" fill="#22c55e"/>
      <text x="122" y="16" fill="rgba(255,255,255,0.55)" font-size="10">已连接</text>
    </g>

    <!-- Platform: 抖音 -->
    <g transform="translate(400, 30)">
      <circle cx="12" cy="12" r="12" fill="rgba(6,182,212,0.15)"/>
      <text x="12" y="16" fill="#06b6d4" font-size="10" font-weight="600" text-anchor="middle">抖</text>
      <text x="32" y="16" fill="rgba(255,255,255,0.8)" font-size="12" font-weight="500">抖音</text>
      <circle cx="92" cy="12" r="4" fill="#eab308"/>
      <text x="104" y="16" fill="rgba(255,255,255,0.55)" font-size="10">Token 即将过期</text>
    </g>

    <!-- Platform: Twitch -->
    <g transform="translate(620, 30)">
      <circle cx="12" cy="12" r="12" fill="rgba(147,51,234,0.15)"/>
      <text x="12" y="16" fill="#9333ea" font-size="10" font-weight="600" text-anchor="middle">T</text>
      <text x="32" y="16" fill="rgba(255,255,255,0.8)" font-size="12" font-weight="500">Twitch</text>
      <circle cx="100" cy="12" r="4" fill="rgba(255,255,255,0.2)"/>
      <text x="112" y="16" fill="rgba(255,255,255,0.55)" font-size="10">未连接</text>
    </g>

    <!-- Add Platform -->
    <rect x="820" y="28" width="100" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="870" y="47" fill="rgba(255,255,255,0.4)" font-size="11" text-anchor="middle">+ 添加平台</text>
  </g>

  <!-- ═══════════ SECTION 2: PUBLISH QUEUE (main content) ═══════════ -->
  <g transform="translate(272, 224)">
    <text x="0" y="16" fill="rgba(255,255,255,0.8)" font-size="15" font-weight="600">发布队列</text>
    <text x="80" y="16" fill="rgba(255,255,255,0.55)" font-size="11">5 条任务</text>

    <!-- Filter bar -->
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="760" height="40" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="25" fill="rgba(255,255,255,0.35)" font-size="12">🔍 搜索视频标题...</text>
      <!-- Filter pills -->
      <rect x="480" y="8" width="56" height="24" rx="12" fill="rgba(168,85,247,0.12)"/>
      <text x="508" y="24" fill="#a855f7" font-size="10" font-weight="500" text-anchor="middle">全部</text>
      <rect x="544" y="8" width="56" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
      <text x="572" y="24" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="middle">待发布</text>
      <rect x="608" y="8" width="56" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
      <text x="636" y="24" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="middle">已发布</text>
      <rect x="672" y="8" width="72" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
      <text x="708" y="24" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="middle">需处理</text>
    </g>

    <!-- Queue Item 1: Scheduled (green) -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="760" height="80" rx="12" fill="url(#glass)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Thumbnail -->
      <rect x="12" y="12" width="96" height="56" rx="8" fill="rgba(168,85,247,0.15)"/>
      <text x="60" y="45" fill="rgba(255,255,255,0.2)" font-size="20" text-anchor="middle">▶</text>
      <rect x="68" y="52" width="32" height="12" rx="3" fill="rgba(0,0,0,0.5)"/>
      <text x="84" y="62" fill="#fff" font-size="8" text-anchor="middle">18:42</text>
      <!-- Title + Meta -->
      <text x="124" y="32" fill="rgba(255,255,255,0.9)" font-size="13" font-weight="600">原神 4.7 新角色深度测评：散兵重做值不值得抽？</text>
      <text x="124" y="52" fill="rgba(255,255,255,0.55)" font-size="11">B站 18:00 · YouTube 20:00 · 今天</text>
      <!-- Status -->
      <rect x="620" y="24" width="60" height="24" rx="12" fill="rgba(34,197,94,0.15)"/>
      <text x="650" y="40" fill="#22c55e" font-size="10" font-weight="600" text-anchor="middle">已排程</text>
      <!-- Actions -->
      <text x="700" y="40" fill="rgba(255,255,255,0.3)" font-size="14" text-anchor="middle">⋯</text>
    </g>

    <!-- Queue Item 2: Pending (yellow) -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="760" height="80" rx="12" fill="url(#glass)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="12" y="12" width="96" height="56" rx="8" fill="rgba(59,130,246,0.15)"/>
      <text x="60" y="45" fill="rgba(255,255,255,0.2)" font-size="20" text-anchor="middle">▶</text>
      <rect x="68" y="52" width="32" height="12" rx="3" fill="rgba(0,0,0,0.5)"/>
      <text x="84" y="62" fill="#fff" font-size="8" text-anchor="middle">24:15</text>
      <text x="124" y="32" fill="rgba(255,255,255,0.9)" font-size="13" font-weight="600">鸣潮全角色强度天梯榜 v2.3</text>
      <text x="124" y="52" fill="rgba(255,255,255,0.55)" font-size="11">B站 · 草稿 · 封面待确认</text>
      <rect x="604" y="24" width="72" height="24" rx="12" fill="rgba(234,179,8,0.15)"/>
      <text x="640" y="40" fill="#eab308" font-size="10" font-weight="600" text-anchor="middle">待完善</text>
      <text x="700" y="40" fill="rgba(255,255,255,0.3)" font-size="14" text-anchor="middle">⋯</text>
    </g>

    <!-- Queue Item 3: Needs Action — RED (OAuth expired) -->
    <g transform="translate(0, 256)">
      <rect x="0" y="0" width="760" height="80" rx="12" fill="url(#glass)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
      <rect x="12" y="12" width="96" height="56" rx="8" fill="rgba(239,68,68,0.1)"/>
      <text x="60" y="45" fill="rgba(255,255,255,0.2)" font-size="20" text-anchor="middle">▶</text>
      <rect x="68" y="52" width="32" height="12" rx="3" fill="rgba(0,0,0,0.5)"/>
      <text x="84" y="62" fill="#fff" font-size="8" text-anchor="middle">12:08</text>
      <text x="124" y="32" fill="rgba(255,255,255,0.9)" font-size="13" font-weight="600">绝区零首发体验：战斗系统深度解析</text>
      <text x="124" y="52" fill="rgba(255,255,255,0.55)" font-size="11">YouTube · 发布失败：OAuth token 过期 · 30 分钟前</text>
      <rect x="580" y="24" width="80" height="24" rx="12" fill="rgba(239,68,68,0.15)"/>
      <text x="620" y="40" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">需人工处理</text>
      <!-- CTA buttons -->
      <rect x="668" y="20" width="40" height="28" rx="8" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
      <text x="688" y="38" fill="#ef4444" font-size="9" font-weight="500" text-anchor="middle">重新授权</text>
      <text x="724" y="40" fill="rgba(255,255,255,0.3)" font-size="14" text-anchor="middle">⋯</text>
    </g>

    <!-- Queue Item 4: Publishing (blue animated) -->
    <g transform="translate(0, 344)">
      <rect x="0" y="0" width="760" height="80" rx="12" fill="url(#glass)" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
      <rect x="12" y="12" width="96" height="56" rx="8" fill="rgba(59,130,246,0.15)"/>
      <text x="60" y="45" fill="rgba(255,255,255,0.2)" font-size="20" text-anchor="middle">▶</text>
      <text x="124" y="32" fill="rgba(255,255,255,0.9)" font-size="13" font-weight="600">绝区零首发体验：战斗系统深度解析</text>
      <text x="124" y="52" fill="rgba(255,255,255,0.55)" font-size="11">B站 · 正在发布... · 上传进度 67%</text>
      <!-- Progress bar -->
      <rect x="124" y="60" width="400" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
      <rect x="124" y="60" width="268" height="4" rx="2" fill="#3b82f6"/>
      <rect x="604" y="24" width="72" height="24" rx="12" fill="rgba(59,130,246,0.15)"/>
      <text x="640" y="40" fill="#3b82f6" font-size="10" font-weight="600" text-anchor="middle">发布中...</text>
    </g>

    <!-- Queue Item 5: Published (dim green) -->
    <g transform="translate(0, 432)">
      <rect x="0" y="0" width="760" height="80" rx="12" fill="url(#glass)" stroke="rgba(255,255,255,0.06)" stroke-width="1" opacity="0.7"/>
      <rect x="12" y="12" width="96" height="56" rx="8" fill="rgba(34,197,94,0.1)"/>
      <text x="60" y="45" fill="rgba(255,255,255,0.15)" font-size="20" text-anchor="middle">✓</text>
      <text x="124" y="32" fill="rgba(255,255,255,0.7)" font-size="13" font-weight="600">原神 4.6 版本全攻略</text>
      <text x="124" y="52" fill="rgba(255,255,255,0.55)" font-size="11">B站 + YouTube · 已发布 · 2 天前</text>
      <rect x="612" y="24" width="60" height="24" rx="12" fill="rgba(34,197,94,0.1)"/>
      <text x="642" y="40" fill="rgba(34,197,94,0.6)" font-size="10" font-weight="500" text-anchor="middle">已发布</text>
      <text x="700" y="40" fill="rgba(255,255,255,0.3)" font-size="14" text-anchor="middle">⋯</text>
    </g>
  </g>

  <!-- ═══════════ SECTION 3: RIGHT SIDEBAR — Scheduling + Stats ═══════════ -->
  <!-- Quick Schedule Card -->
  <g transform="translate(1052, 224)">
    <rect x="0" y="0" width="340" height="240" rx="14" fill="url(#glass)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="28" fill="rgba(255,255,255,0.8)" font-size="14" font-weight="600">排程概览</text>
    <text x="280" y="28" fill="rgba(255,255,255,0.55)" font-size="10">本周</text>

    <!-- Mini calendar days -->
    <g transform="translate(16, 44)">
      <rect x="0" y="0" width="44" height="64" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="22" y="16" fill="rgba(255,255,255,0.4)" font-size="10" text-anchor="middle" font-weight="500">一</text>
      <text x="22" y="36" fill="rgba(255,255,255,0.2)" font-size="9" text-anchor="middle">—</text>

      <rect x="50" y="0" width="44" height="64" rx="8" fill="rgba(168,85,247,0.1)"/>
      <text x="72" y="16" fill="rgba(255,255,255,0.4)" font-size="10" text-anchor="middle" font-weight="500">二</text>
      <text x="72" y="32" fill="#a855f7" font-size="8" text-anchor="middle" font-weight="500">18:00</text>
      <text x="72" y="44" fill="rgba(255,255,255,0.4)" font-size="7" text-anchor="middle">原神测评</text>

      <rect x="100" y="0" width="44" height="64" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="122" y="16" fill="rgba(255,255,255,0.4)" font-size="10" text-anchor="middle" font-weight="500">三</text>

      <rect x="150" y="0" width="44" height="64" rx="8" fill="rgba(59,130,246,0.1)"/>
      <text x="172" y="16" fill="rgba(255,255,255,0.4)" font-size="10" text-anchor="middle" font-weight="500">四</text>
      <text x="172" y="32" fill="#3b82f6" font-size="8" text-anchor="middle" font-weight="500">20:00</text>
      <text x="172" y="44" fill="rgba(255,255,255,0.4)" font-size="7" text-anchor="middle">天梯榜</text>

      <rect x="200" y="0" width="44" height="64" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="222" y="16" fill="rgba(255,255,255,0.4)" font-size="10" text-anchor="middle" font-weight="500">五</text>

      <rect x="250" y="0" width="44" height="64" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="272" y="16" fill="rgba(255,255,255,0.4)" font-size="10" text-anchor="middle" font-weight="500">六</text>
    </g>

    <!-- Stats summary -->
    <g transform="translate(16, 130)">
      <text x="0" y="12" fill="rgba(255,255,255,0.55)" font-size="10">本周发布统计</text>
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="92" height="56" rx="8" fill="rgba(34,197,94,0.08)"/>
        <text x="46" y="20" fill="#22c55e" font-size="20" font-weight="700" text-anchor="middle" font-family="'Geist Mono', monospace">3</text>
        <text x="46" y="40" fill="rgba(255,255,255,0.4)" font-size="9" text-anchor="middle">已发布</text>
        <rect x="100" y="0" width="92" height="56" rx="8" fill="rgba(59,130,246,0.08)"/>
        <text x="146" y="20" fill="#3b82f6" font-size="20" font-weight="700" text-anchor="middle" font-family="'Geist Mono', monospace">2</text>
        <text x="146" y="40" fill="rgba(255,255,255,0.4)" font-size="9" text-anchor="middle">待发布</text>
        <rect x="200" y="0" width="92" height="56" rx="8" fill="rgba(239,68,68,0.08)"/>
        <text x="246" y="20" fill="#ef4444" font-size="20" font-weight="700" text-anchor="middle" font-family="'Geist Mono', monospace">1</text>
        <text x="246" y="40" fill="rgba(255,255,255,0.4)" font-size="9" text-anchor="middle">需处理</text>
      </g>
    </g>
  </g>

  <!-- Error Pattern Card -->
  <g transform="translate(1052, 480)">
    <rect x="0" y="0" width="340" height="160" rx="14" fill="url(#glass)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="28" fill="rgba(255,255,255,0.8)" font-size="14" font-weight="600">失败分析</text>

    <g transform="translate(20, 48)">
      <!-- Error type 1 -->
      <rect x="0" y="0" width="300" height="32" rx="8" fill="rgba(239,68,68,0.06)"/>
      <circle cx="16" cy="16" r="4" fill="#ef4444"/>
      <text x="28" y="20" fill="rgba(255,255,255,0.8)" font-size="11">OAuth token 过期</text>
      <text x="260" y="20" fill="#ef4444" font-size="10" text-anchor="end" font-weight="500">重新授权 →</text>
    </g>
    <g transform="translate(20, 88)">
      <!-- Error type 2 -->
      <rect x="0" y="0" width="300" height="32" rx="8" fill="rgba(234,179,8,0.06)"/>
      <circle cx="16" cy="16" r="4" fill="#eab308"/>
      <text x="28" y="20" fill="rgba(255,255,255,0.8)" font-size="11">文件格式不支持</text>
      <text x="260" y="20" fill="#eab308" font-size="10" text-anchor="end" font-weight="500">查看详情 →</text>
    </g>
  </g>

  <!-- Batch Actions Bar (floating) -->
  <g transform="translate(272, 780)">
    <rect x="0" y="0" width="760" height="56" rx="14" fill="rgba(13,14,20,0.95)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="20" y="34" fill="rgba(255,255,255,0.55)" font-size="12">已选择 2 项</text>
    <rect x="140" y="14" width="100" height="28" rx="14" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
    <text x="190" y="33" fill="#a855f7" font-size="11" font-weight="600" text-anchor="middle">批量排程</text>
    <rect x="252" y="14" width="100" height="28" rx="14" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
    <text x="302" y="33" fill="#ef4444" font-size="11" font-weight="500" text-anchor="middle">批量删除</text>
    <rect x="364" y="14" width="100" height="28" rx="14" fill="rgba(255,255,255,0.06)"/>
    <text x="414" y="33" fill="rgba(255,255,255,0.55)" font-size="11" text-anchor="middle">导出 CSV</text>
  </g>

  <!-- Label -->
  <text x="720" y="1190" fill="rgba(255,255,255,0.08)" font-size="11" text-anchor="middle">GameForge · Publish Center · Design Mockup v1 by @Designer</text>
</svg>